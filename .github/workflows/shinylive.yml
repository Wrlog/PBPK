name: Test and deploy the web version

# Runs the model tests, checks the browser engine against mrgsolve, then
# exports the app to WebAssembly with shinylive and publishes it to GitHub
# Pages, so it runs in the browser with no server. If any test fails,
# nothing is deployed.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install R packages
        run: |
          Rscript -e 'install.packages(c("mrgsolve", "shiny", "shinydashboard", "DT", "ggplot2", "scales", "shinylive"))'

      - name: Model properties (base R)
        run: Rscript tests/test_model.R

      - name: Browser engine vs mrgsolve
        run: Rscript tests/test_engine_vs_mrgsolve.R

      - name: Parse the app
        run: |
          Rscript -e 'invisible(parse("app.R")); invisible(lapply(list.files("R", full.names = TRUE), parse)); cat("parses\n")'

      # The browser build gets app.R and R/ only. reference/ (mrgsolve) and
      # models/ stay behind, since nothing can be compiled in a browser.
      - name: Assemble the app directory
        run: |
          mkdir -p build/R
          cp app.R build/
          cp R/*.R build/R/
          ls -R build

      - name: Export to WebAssembly
        run: Rscript -e 'shinylive::export("build", "site")'

      - name: Landing page check
        run: test -f site/index.html && du -sh site

      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
