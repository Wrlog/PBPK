name: Test and deploy the web apps

# Runs the tests (every model against mrgsolve, and against its published
# results), then exports each app in apps/ to WebAssembly with shinylive
# and publishes them, with the landing page, to GitHub Pages. If any test
# fails, nothing is deployed.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install R packages
        run: |
          Rscript -e 'install.packages(c("mrgsolve", "shiny", "shinydashboard", "DT", "ggplot2", "scales", "jsonlite", "shinylive"))'

      - name: Run the tests
        run: |
          for t in tests/*.R; do
            echo "::group::$t"
            Rscript "$t"
            echo "::endgroup::"
          done

      # Each app gets app.R, its own R/ and data/ files, the shared R code
      # and the model files. reference/ (mrgsolve) stays behind: nothing can
      # be compiled in a browser.
      - name: Assemble the apps
        run: bash tools/assemble_apps.sh build

      - name: Export to WebAssembly
        run: |
          for d in build/*/; do
            name=$(basename "$d")
            Rscript -e 'a <- commandArgs(TRUE); shinylive::export(a[1], "site", subdir = a[2])' "$d" "$name"
          done
          cp landing/index.html site/index.html

      - name: Check the site
        run: |
          test -f site/index.html
          for d in build/*/; do test -f "site/$(basename "$d")/index.html"; done
          du -sh site

      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
